name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: En son yuklenen zip dosyasini ac
        shell: bash
        run: |
          best=""; bt=0
          for f in *.zip; do
            t=$(git log -1 --format=%ct -- "$f")
            if [ "$t" -ge "$bt" ]; then bt=$t; best="$f"; fi
          done
          echo "Secilen zip: $best"
          unzip -oq "$best"
          echo "--- app/build.gradle ---"
          sed -n 1,30p app/build.gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Derle
        shell: bash
        run: gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
      - name: Hatalari goster
        if: failure()
        shell: bash
        run: |
          {
            echo "### Derleme hatasi"
            echo '```'
            grep -B3 -A6 -E "error:|Could not resolve|FAILURE|What went wrong|Build file" build.log | head -120
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Netim-apk
          path: app/build/outputs/apk/debug/app-debug.apk
